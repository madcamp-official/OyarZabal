[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oyarzabal"
version = "0.1.0"
description = "Leakage-safe MLB next-pitch prediction and replay artifacts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "flask>=3,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pyarrow>=18,<26",
  "pybaseball>=2.2.7,<3",
  "scikit-learn>=1.6,<2",
  "scipy>=1.15,<2",
  "xgboost>=3,<4",
]

[project.optional-dependencies]
benchmark = [
  "gunicorn>=23,<24",
]
sequence = [
  "torch>=2.5,<3",
]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
oyarzabal-build-demo = "oyarzabal.pipeline:main"
oyarzabal-fetch-statcast = "oyarzabal.data:main"
oyarzabal-human-benchmark-api = "oyarzabal.benchmark_api:main"
oyarzabal-generate-daily = "oyarzabal.daily_generate:main"
oyarzabal-train-v8 = "oyarzabal.v8:main"
oyarzabal-train-v83 = "oyarzabal.v83:main"
oyarzabal-train-v84 = "oyarzabal.v84:main"
oyarzabal-train-v85 = "oyarzabal.v85:main"
oyarzabal-train-v9a = "oyarzabal.v9a:main"
oyarzabal-resource-snapshot = "oyarzabal.resources:main"
oyarzabal-train-hybrid = "oyarzabal.training:main"
oyarzabal-evaluate-holdout = "oyarzabal.holdout:main"

[tool.hatch.build.targets.wheel]
packages = ["ml/oyarzabal"]

[tool.pytest.ini_options]
testpaths = ["ml/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
