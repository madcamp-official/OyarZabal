[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oyarzabal"
version = "0.1.0"
description = "Leakage-safe MLB next-pitch prediction and replay artifacts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pyarrow>=18,<26",
  "pybaseball>=2.2.7,<3",
  "scikit-learn>=1.6,<2",
  "scipy>=1.15,<2",
  "xgboost>=3,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
oyarzabal-build-demo = "oyarzabal.pipeline:main"
oyarzabal-fetch-statcast = "oyarzabal.data:main"
oyarzabal-resource-snapshot = "oyarzabal.resources:main"
oyarzabal-train-hybrid = "oyarzabal.training:main"
oyarzabal-evaluate-holdout = "oyarzabal.holdout:main"

[tool.hatch.build.targets.wheel]
packages = ["ml/oyarzabal"]

[tool.pytest.ini_options]
testpaths = ["ml/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
